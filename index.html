<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="极简黑白机械翻页时钟，固定显示北京时间，支持离线使用。">
  <title>北京时间 · Flip Clock</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="翻页时钟">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Arial' font-size='24' font-weight='bold' fill='white'%3E8%3C/text%3E%3Cpath d='M2 16h28' stroke='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock" role="timer" aria-label="北京时间" aria-live="off">
    <div class="digit-pair" data-unit="hours" aria-hidden="true"></div>
    <span class="colon" aria-hidden="true">:</span>
    <div class="digit-pair" data-unit="minutes" aria-hidden="true"></div>
    <span class="colon" aria-hidden="true">:</span>
    <div class="digit-pair" data-unit="seconds" aria-hidden="true"></div>
  </main>
  <template id="digit-template">
    <div class="digit">
      <div class="half top"><span class="glyph">0</span></div>
      <div class="half bottom"><span class="glyph">0</span></div>
      <div class="half flap flap-top"><span class="glyph">0</span></div>
      <div class="half flap flap-bottom"><span class="glyph">0</span></div>
      <span class="seam"></span>
    </div>
  </template>
  <script src="script.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
